<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Search / Results — The Construction Technology Directory</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="../assets/ctd/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="m.css">
</head>
<body>
<div id="m-hdr"></div>
<main class="m-main">
  <a class="m-back" href="index.html" id="back"></a>
  <h1 class="m-h1">Search <span class="sl">/</span> Results</h1>
  <div class="m-sbox">
    <div class="tabs" id="tabs"></div>
    <div class="pan"><div id="flds"></div><button class="m-go" id="go" type="button"></button></div>
  </div>
  <div class="m-bar"><h2 id="found"></h2><span class="m-sortl">Sort: Company Name</span></div>
  <a class="m-refine" id="refine" href="advanced-search.html">Refine These Results</a>
  <div id="list"></div>
  <div class="m-pg"><div class="m-pgn" id="pgn"></div>
    <div class="m-rpp">Results per page:<select id="rpp" aria-label="Results per page"><option>10</option><option selected>25</option><option>50</option></select></div></div>
</main>
<div id="m-nav"></div>

<script src="../assets/tools-data.js"></script>
<script src="../assets/taxonomy-data.js"></script>
<script src="../assets/filters.js"></script>
<script src="../assets/actions.js"></script>
<script src="m-hier.js"></script>
<script src="m.js"></script>
<script>
(function(){
  M.shell({placeholder:'Search everything…', active:'search'});
  var E=M.esc, I=M.icon, H=window.M_HIER, A=window.CTD_ACTIONS;
  document.getElementById('back').innerHTML=I('arrowl')+'Back to Home Page';
  document.getElementById('refine').insertAdjacentHTML('beforeend',I('arrowlong'));

  var sp=new URLSearchParams(location.search), f=M.params(), applied;
  var tab=sp.get('tab')==='work'?'work':'vendors', page=1, rpp=25, expanded={};
  ['cat','sub','prod','mt','div','trd','mkt','avail','sz'].forEach(function(k){ if(!f[k]) f[k]=[]; });
  applied=JSON.parse(JSON.stringify(f));

  var CFG={
    vendors:{keys:['cat','sub','prod'],names:['Category','Subcategory','Product'],all:['All categories','All subcategories','All products'],btn:'Search Vendors'},
    work:{keys:['mt','div','trd'],names:['Master Group','Division','Trade'],all:['All master groups','All divisions','All trades'],btn:'Search By Construction Work'}
  };
  var CHILD={cat:['sub','prod'],sub:['prod'],mt:['div','trd'],div:['trd']};
  function byLabel(a,b){ return a[1].localeCompare(b[1]); }
  function options(k){
    var o=[];
    if(k==='cat') o=M.vocab.categories.map(function(x){return [x.value,x.label];}).sort(byLabel);
    if(k==='sub'){ o=M.vocab.subcategories.filter(function(x){ return !f.cat.length||f.cat.indexOf(H.subCat[x.value])>-1; }).map(function(x){return [x.value,x.label];}).sort(byLabel); }
    if(k==='prod'){
      var subs=f.sub.length?f.sub:(f.cat.length?Object.keys(H.subCat).filter(function(s){return f.cat.indexOf(H.subCat[s])>-1;}):null);
      if(subs) o=M.vocab.products.filter(function(x){ return (H.prodSubs[x.value]||[]).some(function(s){return subs.indexOf(s)>-1;}); }).map(function(x){return [x.value,x.label];}).sort(byLabel);
    }
    if(k==='mt') o=M.vocab.masterTrades.map(function(x){return [x.value,x.label];});
    if(k==='div') o=M.vocab.divisions.filter(function(x){ return !f.mt.length||f.mt.indexOf(H.divMg[x.value])>-1; }).map(function(x){return [x.value,x.label];});
    if(k==='trd'){
      var ds=f.div.length?f.div:(f.mt.length?Object.keys(H.divMg).filter(function(d){return f.mt.indexOf(H.divMg[d])>-1;}):null);
      if(ds) o=M.vocab.trades.filter(function(x){ return ds.indexOf(H.trdDiv[x.value])>-1; }).map(function(x){return [x.value,x.label];}).sort(byLabel);
    }
    return o;
  }
  function drawFields(){
    var c=CFG[tab];
    document.getElementById('flds').innerHTML=c.keys.map(function(k,i){
      var o=options(k), cur=f[k], dis=(k==='prod'||k==='trd')&&!o.length&&!cur.length;
      var h='<label class="m-fld"><span>'+c.names[i]+':</span><select data-k="'+k+'"'+(dis?' disabled':'')+'><option value="">'+c.all[i]+'</option>';
      if(cur.length>1) h+='<option value="__multi__" selected>Multiple selected ('+cur.length+')</option>';
      h+=o.map(function(x){ return '<option value="'+E(x[0])+'"'+(cur.length===1&&cur[0]===x[0]?' selected':'')+'>'+E(x[1])+'</option>'; }).join('');
      if(cur.length===1&&!o.some(function(x){return x[0]===cur[0];})) h+='<option value="'+E(cur[0])+'" selected>'+E(M.strip(cur[0]))+'</option>';
      return h+'</select></label>';
    }).join('');
    document.getElementById('go').innerHTML=I('search')+'<span>'+c.btn+'</span>';
  }
  document.getElementById('flds').addEventListener('change',function(e){
    var s=e.target.closest('select'); if(!s) return; var k=s.getAttribute('data-k');
    if(s.value==='__multi__') return;
    f[k]=s.value?[s.value]:[];
    (CHILD[k]||[]).forEach(function(c){ f[c]=[]; });
    drawFields();
  });
  function drawTabs(){
    document.getElementById('tabs').innerHTML='<button type="button" data-t="vendors"'+(tab==='vendors'?' class="on"':'')+'>Search Vendors</button>'+
      '<button type="button" data-t="work"'+(tab==='work'?' class="on"':'')+'>Search By Construction Work</button>';
  }
  document.getElementById('tabs').addEventListener('click',function(e){
    var b=e.target.closest('button'); if(!b||b.getAttribute('data-t')===tab) return;
    CFG[tab].keys.forEach(function(k){ f[k]=[]; applied[k]=[]; });   // each tab is its own search
    tab=b.getAttribute('data-t'); drawTabs(); drawFields(); page=1; render(); sync();
  });
  document.getElementById('go').addEventListener('click',function(){
    applied=JSON.parse(JSON.stringify(f)); page=1; render(); sync();
    document.getElementById('found').scrollIntoView({behavior:'smooth',block:'start'});
  });

  function clean(o){ var r={}; Object.keys(o).forEach(function(k){ if(k==='q'){ if(o.q) r.q=o.q; } else if(o[k].length) r[k]=o[k].slice(); }); return r; }
  function qs(){ var s=M.toQS(clean(applied)); if(tab==='work') s+=(s?'&':'')+'tab=work'; return s; }
  function sync(){ var s=qs(); history.replaceState(null,'','search.html'+(s?'?'+s:'')); }

  var ROWS={vendors:[['cat','Category'],['sub','Subcategory'],['prod','Product']],work:[['mt','Master Group'],['div','Division'],['trd','Trade']]};
  function rowHtml(t,k,label){
    var v=M.vals[k](t), id=t.s+':'+k, all=expanded[id], shown=all?v:v.slice(0,2), tg=(k==='mt'||k==='div'||k==='trd')?'&tab=work':'';
    var h='<div class="rw"><b>'+label+':</b><span>';
    h+=shown.length?shown.map(function(x){ return '<a class="v" href="search.html?'+encodeURIComponent(k)+'='+encodeURIComponent(x.v)+tg+'">'+E(x.l)+'</a>'; }).join(', '):'—';
    if(!all&&v.length>2) h+=' <a class="cnt" data-x="'+E(id)+'">(+'+(v.length-2)+')</a>';
    else if(all&&v.length>2) h+=' <a class="cnt" data-x="'+E(id)+'">(less)</a>';
    return h+'</span></div>';
  }
  function card(t){
    var sim, c0=(t.c||[])[0], s0=(t.subs||[])[0], m0=(t.mt||[])[0], d0=(t.dv||[])[0];
    if(tab==='vendors') sim='search.html?'+(c0?'cat='+encodeURIComponent(c0):'')+(s0?'&sub='+encodeURIComponent(s0):'');
    else sim='search.html?tab=work'+(m0?'&mt='+encodeURIComponent(m0):'')+(d0&&d0.indexOf('ALL')!==0?'&div='+encodeURIComponent(d0):'');
    return '<article class="m-sc" data-s="'+E(t.s)+'"><div class="top">'+M.logo(t,true)+'<div class="m-vname"><b>'+E(t.n)+'</b>'+
      (t.d?'<a href="https://'+E(t.d)+'" target="_blank" rel="noopener">'+E(t.d)+'</a>':'')+'</div>'+
      '<button class="m-bm'+(A.isVendorSaved(t.s)?' on':'')+'" type="button" data-save="1" aria-label="Save vendor">'+I('bookmark')+'</button>'+
      '<a class="m-vp" href="vendor.html?s='+encodeURIComponent(t.s)+'">View Profile</a></div>'+
      '<div class="rows">'+ROWS[tab].map(function(r){ return rowHtml(t,r[0],r[1]); }).join('')+'</div>'+
      '<a class="m-sim" href="'+sim+'">Find Similar Vendors'+I('arrowlong')+'</a></article>';
  }
  document.getElementById('list').addEventListener('click',function(e){
    var x=e.target.closest('[data-x]');
    if(x){ var id=x.getAttribute('data-x'); expanded[id]=!expanded[id]; var c=x.closest('.m-sc'); var t=M.bySlug(c.getAttribute('data-s'));
      var r=x.closest('.rw'), key=id.split(':')[1], lbl=ROWS[tab].filter(function(q){return q[0]===key;})[0][1];
      r.outerHTML=rowHtml(t,key,lbl); return; }
    var b=e.target.closest('[data-save]');
    if(b){ var t2=M.bySlug(b.closest('.m-sc').getAttribute('data-s')); b.classList.toggle('on',A.toggleSaveVendor(t2.s,t2.n)); }
  });

  function render(){
    var data=M.apply(clean(applied)).slice().sort(function(a,b){ return a.n.localeCompare(b.n,undefined,{sensitivity:'base'}); });
    var pages=Math.max(1,Math.ceil(data.length/rpp)); if(page>pages) page=pages;
    document.getElementById('found').textContent=data.length.toLocaleString()+' Vendors Found';
    var s=(page-1)*rpp;
    document.getElementById('list').innerHTML=data.slice(s,s+rpp).map(card).join('')||'<div class="m-empty">No vendors match your search criteria.</div>';
    document.getElementById('pgn').innerHTML=M.pagerNums(page,pages);
    var q=M.toQS(clean(applied)); document.getElementById('refine').setAttribute('href','advanced-search.html'+(q?'?'+q:''));
  }
  document.getElementById('pgn').addEventListener('click',function(e){
    var b=e.target.closest('button'); if(!b||b.disabled) return; page=+b.getAttribute('data-p'); render();
    document.getElementById('found').scrollIntoView({behavior:'smooth',block:'start'});
  });
  document.getElementById('rpp').addEventListener('change',function(){ rpp=+this.value; page=1; render(); });

  drawTabs(); drawFields(); render();
})();
</script>
</body>
</html>
