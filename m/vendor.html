<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vendor Page — The Construction Technology Directory</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="../assets/ctd/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="m.css">
</head>
<body>
<div id="m-hdr"></div>
<main class="m-main">
  <a class="m-back" href="results.html" id="back"></a>
  <h1 class="m-h1" style="font-size:25px;color:#0C2A6B;margin-bottom:8px">VENDOR PAGE</h1>
  <div id="vp"></div>
</main>
<div id="m-nav"></div>

<script src="../assets/tools-data.js"></script>
<script src="../assets/taxonomy-data.js"></script>
<script src="../assets/filters.js"></script>
<script src="../assets/actions.js"></script>
<script src="m.js"></script>
<script>
(function(){
  M.shell({placeholder:'Search by Keyword', active:''});
  var E=M.esc, I=M.icon, A=window.CTD_ACTIONS;
  document.getElementById('back').innerHTML=I('chevl')+'Back to Advanced Results';
  var slug=new URLSearchParams(location.search).get('s');
  var t=M.bySlug(slug)||(window.TOOLS||[])[0]; if(!t){ document.getElementById('vp').innerHTML='<div class="m-empty">Vendor not found.</div>'; return; }
  document.title=t.n+' — The Construction Technology Directory';
  var site=t.d?'https://'+t.d:'', ci=t.ci||{};
  var cats=M.vals.cat(t).map(function(x){return x.l;});
  var strip=function(a){ return (a||[]).map(M.strip); };
  var mk=(t.mkt||[]).join(', ');
  var av=M.avail(t.sz);

  function list(items,n){            // summary: first n values joined by "; ", rest behind a toggle
    if(!items.length) return '<span>—</span>';
    if(items.length<=n) return E(items.join('; '));
    return '<span class="s">'+E(items.slice(0,n).join('; '))+'</span> <a class="mo" data-all="'+E(JSON.stringify(items))+'">+'+(items.length-n)+' more</a>';
  }
  function sec(bg,ico,col,title,body,extra){
    return '<section class="m-sec" style="background:'+bg+'"><div class="mn"><span class="ico" style="color:'+col+'">'+I(ico)+'</span><div class="tx"><h3>'+title+'</h3>'+body+'</div></div>'+
      '<div class="tg"><button type="button" aria-label="Expand or collapse '+title+'">'+I('chevu')+'</button></div></section>';
  }
  function qf5(){
    function c(ic,val,cap){ return '<div><div class="vl">'+I(ic)+'<span>'+E(val)+'</span></div><div class="cp">'+cap+'</div></div>'; }
    return '<section class="m-sec qf" style="background:#CCE6FB"><div class="mn" style="flex-direction:column;gap:4px">'+
      '<div style="display:flex;align-items:center;gap:11px"><span class="ico" style="color:var(--blue)">'+I('info')+'</span><h3>QUICK FACTS</h3></div>'+
      '<div class="m-qf5 qfc">'+c('calendar','-','Founded')+c('pin','-','Headquarters')+c('users','-','Employees')+c('cloud',av[0]||'-','Deployment')+
      '<div><div class="vl" title="'+E(mk)+'">'+I('alert')+'<span style="display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;font-size:10.5px">'+E(mk||'-')+'</span></div><div class="cp">Market Sector</div></div></div></div>'+
      '<div class="tg"><button type="button" aria-label="Expand or collapse Quick Facts">'+I('chevu')+'</button></div></section>';
  }
  var saved=A.isVendorSaved(t.s);
  var html=
    '<div class="m-idc"><div class="m-idtop">'+M.logo(t,true)+
      '<div class="m-idname"><b title="'+E(t.n)+'">'+E(t.n)+'</b>'+(t.d?'<a href="'+E(site)+'" target="_blank" rel="noopener">'+I('globe')+'<span>www.'+E(t.d.replace(/^www\./,''))+'</span></a>':'')+'</div>'+
      '<div class="m-idcat"><b>'+E(cats[0]||'')+'</b><span>CATEGORY</span></div>'+
      '<button class="m-idsave'+(saved?' on':'')+'" type="button" data-save="1" aria-label="Save vendor">'+I('bookmark')+'</button></div>'+
    '<p class="m-iddesc">'+E(t.x||'')+'</p>'+
    '<div class="m-idb three"><button class="m-btn" data-a="save" type="button">'+I('bookmark')+'<span>Save Vendor</span></button><button class="m-btn" data-a="export" type="button">'+I('download')+'<span>Export Profile</span></button><button class="m-btn" data-a="share" type="button">'+I('share')+'<span>Share</span></button></div>'+
    '<div class="m-idb two"><a class="m-btn solid" '+(site?'href="'+E(site)+'" target="_blank" rel="noopener"':'')+'>'+I('globe')+'Visit Website</a><a class="m-btn" '+(site?'href="'+E(site)+'" target="_blank" rel="noopener"':'')+'>'+I('monitor')+'Request a Demo</a></div></div>'+
    '<div class="m-hint">Tap any section to expand or collapse.</div>'+
    qf5()+
    sec('#FDDFC5','users','var(--blue)','TYPICAL CUSTOMERS','<div class="sm">'+E(M.customers(t)||'—')+'</div>')+
    sec('#C5EFF3','doc','var(--blue)','COMPANY BIOGRAPHY','<div class="sm clamp" data-bio="1">'+E(t.x||'No company biography on file yet.')+'</div>')+
    sec('#E1D3FC','flower','#8A2BE2','KEY PRODUCTS','<div class="sm">'+list((t.products||[]).map(function(p){return p.n;}),3)+'</div>')+
    sec('#FEDCEA','cube','#E1337A','SUBCATEGORIES','<div class="sm">'+list(t.subs||[],3)+'</div>')+
    sec('#E8E8E8','tag','#1B9AAA','CATEGORIES','<div class="sm">'+list(cats,3)+'</div>')+
    sec('#C8FCD2','users','#2F9E3F','MASTER GROUPS','<div class="sm">'+list(t.mt||[],3)+'</div>')+
    sec('#F4E3C2','doc','#F2751F','DIVISIONS OF WORK','<div class="sm">'+list(strip(t.dv),3)+'</div>')+
    sec('#C7D8FE','wrench','#3F6FD8','CONSTRUCTION TRADES','<div class="sm">'+list(strip(t.trd),3)+'</div>')+
    sec('#FDF2B6','monitor','#F2751F','AVAILABLE ON','<div class="sm">'+E(av.join('; '))+'</div>')+
    sec('#FECDD0','info','#E1337A','CONTACT INFORMATION','<div class="m-ct ct"><div>'+I('pin')+'<span>'+E([ci.city,ci.st].filter(Boolean).join(', ')||'—')+'</span></div>'+
      '<div>'+I('phone')+(ci.ph?'<a href="tel:'+E(ci.ph.replace(/[^0-9+]/g,''))+'">'+E(ci.ph)+'</a>':'<span>—</span>')+'</div>'+
      '<div>'+I('mail')+(ci.em?'<a href="mailto:'+E(ci.em)+'">'+E(ci.em)+'</a>':'<span>—</span>')+'</div></div>')+
    sec('#E3CFE8','info','#8A2BE2','QUICK FACTS','<div class="m-qf2 qfc"><b>Pricing Model</b><span>'+E(t.pm||'—')+'</span><b>Market Sector</b><span>'+E(mk||'—')+'</span></div>');
  document.getElementById('vp').innerHTML=html;

  var vp=document.getElementById('vp');
  vp.addEventListener('click',function(e){
    var tg=e.target.closest('.tg button'); if(tg){ tg.closest('.m-sec').classList.toggle('shut'); return; }
    var mo=e.target.closest('.mo');
    if(mo){ var sm=mo.closest('.sm'); sm.textContent=''; sm.appendChild(document.createTextNode(JSON.parse(mo.getAttribute('data-all')).join('; '))); return; }
    var sv=e.target.closest('[data-save],[data-a="save"]');
    if(sv){ var on=A.toggleSaveVendor(t.s,t.n); document.querySelector('.m-idsave').classList.toggle('on',on);
      var lab=document.querySelector('[data-a="save"] span'); if(lab) lab.textContent=on?'Saved':'Save Vendor'; return; }
    var a=e.target.closest('[data-a]'); if(!a) return; a=a.getAttribute('data-a');
    if(a==='share') A.shareUrl(location.href);
    if(a==='export') A.exportCsv([t],[
      {label:'Vendor',get:function(){return t.n;}},{label:'Website',get:function(){return t.d;}},{label:'Description',get:function(){return t.x;}},
      {label:'Categories',get:function(){return cats.join('; ');}},{label:'Subcategories',get:function(){return (t.subs||[]).join('; ');}},
      {label:'Products',get:function(){return (t.products||[]).map(function(p){return p.n;}).join('; ');}},
      {label:'Master Groups',get:function(){return (t.mt||[]).join('; ');}},{label:'Divisions',get:function(){return (t.dv||[]).join('; ');}},
      {label:'Trades',get:function(){return (t.trd||[]).join('; ');}},{label:'Market Sector',get:function(){return mk;}},
      {label:'Company Size',get:function(){return t.sz;}},{label:'Pricing Model',get:function(){return t.pm;}},
      {label:'Available On',get:function(){return av.join('; ');}},
      {label:'Location',get:function(){return [ci.city,ci.st].filter(Boolean).join(', ');}},{label:'Phone',get:function(){return ci.ph||'';}},{label:'Email',get:function(){return ci.em||'';}}
    ],t.s+'-profile.csv');
  });
  if(saved){ var lab=document.querySelector('[data-a="save"] span'); if(lab) lab.textContent='Saved'; }
})();
</script>
</body>
</html>
