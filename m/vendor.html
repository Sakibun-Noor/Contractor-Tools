<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vendor Page — The Construction Technology Directory</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="../assets/ctd/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="m.css">
</head>
<body>
<div id="m-hdr"></div>
<main class="m-main">
  <a class="m-back" href="results.html" id="back"></a>
  <div id="vp"></div>
</main>
<div id="m-nav"></div>

<script src="../assets/tools-data.js"></script>
<script src="../assets/taxonomy-data.js"></script>
<script src="../assets/filters.js"></script>
<script src="../assets/actions.js"></script>
<script src="m.js"></script>
<script>
(function(){
  M.shell({placeholder:'Search construction technology vendors…', active:'vendors'});
  var E=M.esc, I=M.icon, A=window.CTD_ACTIONS;
  document.getElementById('back').innerHTML=I('chevl')+'Back to Advanced Results';
  var slug=new URLSearchParams(location.search).get('s');
  var t=M.bySlug(slug)||(window.TOOLS||[])[0];
  if(!t){ document.getElementById('vp').innerHTML='<div class="m-empty">Vendor not found.</div>'; return; }
  document.title=t.n+' — The Construction Technology Directory';
  var site=t.d?'https://'+t.d:'', ci=t.ci||{};
  var cats=M.vals.cat(t).map(function(x){return x.l;});
  var strip=function(a){ return (a||[]).map(M.strip); };
  var mk=(t.mkt||[]).join(', '), av=M.avail(t.sz);
  var open={}, ext={};

  // sections, in the client's order: Categories > Subcategories > Products, then Master Groups > Divisions > Trades
  var SEC=[
    {id:'cust',t:'Typical Customers',ico:'users',bg:'#EDE7FA',ic:'#7B4FD6',items:function(){ var c=M.customers(t); return c?[c]:[]; }},
    {id:'bio',t:'Company Biography',ico:'doc',bg:'#DCEAFA',ic:'#1B5FD0',bio:true},
    {id:'cat',t:'Categories',ico:'grid',bg:'#DDF7E3',ic:'#2F9E3F',items:function(){ return cats; }},
    {id:'sub',t:'Subcategories',ico:'layers',bg:'#DDF7E3',ic:'#2F9E3F',items:function(){ return t.subs||[]; }},
    {id:'prod',t:'Products',ico:'gear',bg:'#DDF7E3',ic:'#2F9E3F',items:function(){ return (t.products||[]).map(function(p){return p.n;}); }},
    {id:'mt',t:'Master Groups',ico:'users',bg:'#FDE8D5',ic:'#F2751F',items:function(){ return t.mt||[]; }},
    {id:'div',t:'Divisions',ico:'sitemap',bg:'#FDE8D5',ic:'#F2751F',items:function(){ return strip(t.dv); }},
    {id:'trd',t:'Trades',ico:'wrench',bg:'#FDE8D5',ic:'#F2751F',items:function(){ return strip(t.trd); }},
    {id:'avail',t:'Available On',ico:'cloud',bg:'#DCEAFA',ic:'#1B5FD0',items:function(){ return av; }},
    {id:'ctc',t:'Contact Information',ico:'info',bg:'#DCEAFA',ic:'#1B5FD0',contact:true},
    {id:'qf',t:'Quick Facts',ico:'barchart',bg:'#DCEAFA',ic:'#1B5FD0',facts:true}
  ];
  function qfRows(){ // the old Quick Facts strip + pricing, merged into one section (client request)
    return [['Founded','—'],['Headquarters','—'],['Employees','—'],['Deployment',av[0]||'—'],['Market Sector',mk||'—'],['Pricing Model',t.pm||'—']];
  }
  function body(s){
    var o=!!open[s.id], h;
    if(s.bio){
      var b=t.x||'No company biography on file yet.';
      return o?'<div>'+E(b)+'</div>':'<div class="sm"><div class="clamp">'+E(b)+'</div><a class="n" data-more="'+s.id+'">[+]</a></div>';
    }
    if(s.contact){
      var rows=[[ 'pin',[ci.city,ci.st].filter(Boolean).join(', ')||'—'],['phone',ci.ph||'—'],['mail',ci.em||'—']];
      function line(r){ var v=r[1]; if(v==='—') return '<div>'+I(r[0])+'<span>—</span></div>';
        if(r[0]==='phone') return '<div>'+I('phone')+'<a href="tel:'+E(v.replace(/[^0-9+]/g,''))+'">'+E(v)+'</a></div>';
        if(r[0]==='mail') return '<div>'+I('mail')+'<a href="mailto:'+E(v)+'">'+E(v)+'</a></div>'; return '<div>'+I('pin')+'<span>'+E(v)+'</span></div>'; }
      return o?'<div class="ct">'+rows.map(line).join('')+'</div>':'<div class="sm"><div>'+E(rows[0][1])+'<br>'+E(rows[1][1])+'</div><a class="n" data-more="'+s.id+'">[+1]</a></div>';
    }
    if(s.facts){
      var q=qfRows();
      return o?'<div class="qf">'+q.map(function(r){return '<b>'+r[0]+':</b><span>'+E(r[1])+'</span>';}).join('')+'</div>':
        '<div class="sm"><div>'+E(q[3][0]+': '+q[3][1])+'<br>'+E(q[4][0]+': '+q[4][1])+'</div><a class="n" data-more="'+s.id+'">[+'+(q.length-2)+']</a></div>';
    }
    var it=s.items();
    if(!it.length) return '<span>—</span>';
    if(o) return '<ul>'+it.map(function(x){return '<li>'+E(x)+'</li>';}).join('')+'</ul>';
    return '<div class="sm"><div>'+E(it.slice(0,2).join(', '))+'</div>'+(it.length>2?'<a class="n" data-more="'+s.id+'">[+'+(it.length-2)+']</a>':'')+'</div>';
  }
  function secHtml(s){
    var o=!!open[s.id];
    return '<section class="m-vs" data-id="'+s.id+'"><button class="hd" type="button" style="background:'+s.bg+'" aria-expanded="'+o+'"><span class="ico" style="color:'+s.ic+'">'+I(s.ico)+'</span><b>'+s.t+'</b><span class="chev">'+I(o?'chevu':'chevd')+'</span></button><div class="bd">'+body(s)+'</div></section>';
  }
  var saved=A.isVendorSaved(t.s);
  function draw(){
    document.getElementById('vp').innerHTML=
      '<div class="m-vh"><h1 class="m-h1" style="font-size:25px;text-transform:uppercase">Vendor Page</h1><button class="m-bm'+(saved?' on':'')+'" type="button" data-save="1" aria-label="Save vendor">'+I('bookmark')+'</button></div>'+
      '<div class="m-vid">'+M.logo(t,true)+'<div class="nm"><b>'+E(t.n)+'</b>'+(t.d?'<a href="'+E(site)+'" target="_blank" rel="noopener">www.'+E(t.d.replace(/^www\./,''))+'</a>':'')+'<span>'+E(cats[0]||'')+'</span></div></div>'+
      '<div class="m-vbtn"><a class="m-btn orange" '+(site?'href="'+E(site)+'" target="_blank" rel="noopener"':'')+'>'+I('globe')+'Visit Website</a><a class="m-btn line" '+(site?'href="'+E(site)+'" target="_blank" rel="noopener"':'')+'>'+I('monitor')+'Request a Demo</a></div>'+
      '<button class="m-xc" type="button" data-all="1">Expand / Collapse</button>'+SEC.map(secHtml).join('');
  }
  document.getElementById('vp').addEventListener('click',function(e){
    if(e.target.closest('[data-save]')){ saved=A.toggleSaveVendor(t.s,t.n); e.target.closest('[data-save]').classList.toggle('on',saved); return; }
    if(e.target.closest('[data-all]')){ var anyShut=SEC.some(function(s){return !open[s.id];}); SEC.forEach(function(s){ open[s.id]=anyShut; }); draw(); return; }
    var sec=e.target.closest('.m-vs'); if(!sec) return; var id=sec.getAttribute('data-id');
    if(e.target.closest('.hd')||e.target.closest('[data-more]')){ open[id]=!open[id]; var s=SEC.filter(function(x){return x.id===id;})[0]; sec.outerHTML=secHtml(s); }
  });
  draw();
})();
</script>
</body>
</html>
